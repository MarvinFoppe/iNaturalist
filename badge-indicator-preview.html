<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badge-Aufstieg · Ruhezustand-Vorschau</title>
<style>
    :root{
        --accent:#9bcc5f; --accent-light:#bfe08f; --accent-glow:rgba(155,204,95,.35);
        --gold:#e9c65a; --bg-dark:#0f1712;
        --t1: conic-gradient(from 210deg,#6b4423,#c8813f,#f0b46a,#a5642e,#6b4423,#d18b46,#6b4423);
        --t2: conic-gradient(from 210deg,#5c3f18,#a9762f,#e4c07a,#8a5f22,#5c3f18,#c39a4e,#5c3f18);
        --t3: conic-gradient(from 210deg,#5c666c,#c3ccd2,#ffffff,#9aa3a9,#5c666c,#d6dde1,#5c666c);
        --t4: conic-gradient(from 210deg,#7d6412,#d9bb52,#f8ea9e,#b89a34,#7d6412,#ecd06a,#7d6412);
        --t5: conic-gradient(from 210deg,#7a560a,#d4af37,#fbe196,#b58e22,#7a560a,#e6c34e,#7a560a);
        --t6: conic-gradient(from 210deg,#4e6155,#bfe0cb,#ffffff,#9cc0a8,#4e6155,#d8efdf,#4e6155);
        --t7: conic-gradient(from 210deg,#166b34,#33c95a,#d6ffe2,#e6c34e,#1f8f45,#f8ea9e,#166b34);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0b110b;color:#eaf3ec;font-family:'Open Sans',system-ui,sans-serif;min-height:100vh;}

    /* ---- Steuerleiste oben ---- */
    .bar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(11,17,11,.92);
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(155,204,95,.2);
        padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;}
    .bar b{font-family:'Playfair Display',Georgia,serif;color:var(--accent-light);margin-right:8px;font-size:1.05em;}
    .seg{display:inline-flex;background:rgba(20,32,18,.8);border:1px solid rgba(155,204,95,.25);border-radius:22px;overflow:hidden;}
    .seg button{background:none;border:none;color:#9fb39a;font-size:.85em;padding:9px 16px;cursor:pointer;font-weight:600;}
    .seg button.on{background:linear-gradient(180deg,var(--accent-light),var(--accent));color:var(--bg-dark);}
    .hint{width:100%;text-align:center;color:#8fa389;font-size:.78em;}

    /* ---- Fake-App-Hintergrund (nur Kulisse) ---- */
    .app{padding:96px 16px 40px;max-width:760px;margin:0 auto;filter:saturate(.9);}
    .app h2{font-family:'Playfair Display',Georgia,serif;color:var(--accent);font-size:1.4em;margin-bottom:14px;}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
    .ph{background:rgba(20,32,18,.6);border:1px solid rgba(255,255,255,.06);border-radius:12px;height:140px;
        display:flex;align-items:center;justify-content:center;font-size:2em;opacity:.5;}
    .app p.lead{color:#7f927b;font-size:.9em;margin:6px 0 22px;}

    /* ================= BADGE-AUFSTIEG · RUHE-INDIKATOR ================= */
    /* Optik-Geschwister zum vorhandenen .reward-icon (New species) */
    .rank-icon{position:fixed;right:14px;bottom:80px;z-index:11800;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;gap:6px;
        animation:riPop .5s cubic-bezier(.2,.8,.3,1.4) both;}
    .rank-icon .rk-wrap{position:relative;animation:rkFloat 3s ease-in-out infinite;}
    @keyframes rkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    /* Hexagon-Mini-Badge im Metall-Rang-Look */
    .rk-hex{position:relative;width:58px;height:64px;filter:drop-shadow(0 5px 14px rgba(0,0,0,.5));
        transition:transform .2s ease;}
    .rank-icon:hover .rk-hex{transform:scale(1.08) rotate(-3deg);}
    .rk-hex .plate{position:absolute;inset:0;background:var(--t5);
        clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
    .rk-hex .inner{position:absolute;inset:5px;background:radial-gradient(circle at 40% 30%,#24361f,#0f1a0d 80%);
        clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:inset 0 2px 6px rgba(0,0,0,.8);}
    .rk-hex .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
        font-size:1.7em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
    .rk-hex .glow{position:absolute;inset:-8px;z-index:-1;border-radius:50%;
        background:radial-gradient(circle,rgba(233,198,90,.55),transparent 68%);animation:rkGlow 1.8s ease-in-out infinite;}
    @keyframes rkGlow{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
    /* Aufstiegs-Pfeil-Badge (statt roter Zahl) */
    .rk-up{position:absolute;top:-8px;right:-10px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
        background:linear-gradient(180deg,#f6d365,#e0a020);color:#3a2c00;font-size:12px;font-weight:900;line-height:1;
        display:flex;align-items:center;justify-content:center;border:2px solid #fff;
        box-shadow:0 2px 6px rgba(0,0,0,.4);animation:rkBadge 1.5s ease-in-out infinite;}
    @keyframes rkBadge{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    .rk-label{font-size:11px;font-weight:800;color:#3a2c00;letter-spacing:.02em;
        background:linear-gradient(180deg,#f6d365,#e6b93e);
        padding:3px 10px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);
        text-transform:uppercase;}
    @keyframes riPop{0%{opacity:0;transform:scale(.6) translateY(8px)}100%{opacity:1;transform:scale(1)}}

    /* ---- vorhandenes New-species-Icon (nachgebaut, damit man das Nebeneinander sieht) ---- */
    .reward-icon{position:fixed;right:14px;bottom:80px;z-index:11800;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;gap:5px;animation:riPop .45s cubic-bezier(.2,.8,.3,1.4) both;}
    .reward-icon .ri-cardwrap{position:relative;animation:riFloat 3s ease-in-out infinite;}
    @keyframes riFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .reward-icon .ri-card{width:48px;height:64px;border-radius:8px;overflow:hidden;border:2px solid #e9c65a;
        box-shadow:0 5px 16px rgba(0,0,0,.45);transform:rotate(-7deg);
        background:radial-gradient(circle at 50% 32%,#3a58a6,#1a2747 72%);
        display:flex;align-items:center;justify-content:center;font-size:1.7em;}
    .reward-icon .ri-badge{position:absolute;top:-7px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
        background:#e0342b;color:#fff;font-size:12px;font-weight:800;line-height:1;display:flex;align-items:center;
        justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:riBadge 1.6s ease-in-out infinite;}
    @keyframes riBadge{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .reward-icon .ri-label{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.62);
        padding:2px 8px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);}

    /* Positions-Varianten für das Nebeneinander */
    .stack-species{bottom:80px;}
    .stack-rank-above{bottom:172px;}   /* Rang sitzt über dem Neue-Art-Icon */

    /* ================= Feier-Overlay Variante A (zum echten Antippen) ================= */
    .cel{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:24px;}
    .cel.on{display:flex;}
    .cel-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(30,52,20,.94),rgba(0,0,0,.97));
        -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:celFade .35s ease both;}
    @keyframes celFade{from{opacity:0}to{opacity:1}}
    .rays{position:absolute;top:50%;left:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);pointer-events:none;
        opacity:0;mix-blend-mode:screen;background:repeating-conic-gradient(from 0deg,rgba(233,198,90,.16) 0deg 7deg,transparent 7deg 20deg);
        animation:raysIn .8s ease forwards,raysSpin 26s linear infinite;}
    @keyframes raysIn{to{opacity:1}}@keyframes raysSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    .halo{position:absolute;top:50%;left:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);pointer-events:none;
        background:radial-gradient(circle,var(--accent-glow) 0%,transparent 62%);animation:haloPulse 2.6s ease-in-out infinite;}
    @keyframes haloPulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.95)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.06)}}
    .stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;}
    .hexbig{position:relative;width:210px;height:230px;filter:drop-shadow(0 16px 30px rgba(0,0,0,.6));animation:aPop 1s cubic-bezier(.2,.8,.3,1.3) both;}
    @keyframes aPop{0%{opacity:0;transform:scale(.2) rotate(-40deg)}60%{opacity:1;transform:scale(1.14) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
    .hexbig .plate{position:absolute;inset:0;background:var(--t5);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
    .hexbig .inner{position:absolute;inset:11px;background:radial-gradient(circle at 40% 30%,#24361f,#0f1a0d 80%);
        clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:inset 0 3px 10px rgba(0,0,0,.85);}
    .hexbig .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;font-size:5.4em;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));}
    .hexbig .sheen{position:absolute;inset:0;z-index:3;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
        background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 48%,transparent 58%);background-size:250% 250%;animation:hexSweep 3.6s linear infinite;}
    @keyframes hexSweep{0%{background-position:150% 0}100%{background-position:-90% 0}}
    .kicker{font-size:.82em;font-weight:800;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;animation:riseIn .5s .2s ease both;}
    .cat{font-size:.9em;color:#c9d6c2;margin-bottom:2px;animation:riseIn .5s .25s ease both;}
    .rankname{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:2.6em;line-height:1.05;
        background:linear-gradient(90deg,#f6d365,#fff2c2,#f6d365);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;animation:shimmer 2.6s linear infinite,riseIn .6s .35s ease both;}
    @keyframes shimmer{to{background-position:200% 0}}@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .fromto{font-size:.92em;color:#9fb39a;margin-top:8px;animation:riseIn .6s .45s ease both;}
    .fromto b{color:#eaf3ec;}
    .pips{display:flex;gap:9px;margin-top:16px;animation:riseIn .6s .5s ease both;}
    .pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.14);}
    .pips i.on{background:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
    .pips i.justnow{background:var(--gold);box-shadow:0 0 16px var(--gold),0 0 30px rgba(233,198,90,.6);transform:scale(1.35);}
    .taphint{position:fixed;bottom:26px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:.8em;animation:hintPulse 1.8s ease-in-out infinite;z-index:4;}
    @keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:.95}}
    .fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
    .conf{position:absolute;top:-20px;width:11px;height:16px;border-radius:2px;animation:confFall linear forwards;}
    @keyframes confFall{to{transform:translateY(112vh) rotate(720deg);opacity:.9}}
    .spark{position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:2px;box-shadow:0 0 10px currentColor;animation:sparkOut .95s ease-out forwards;}
    @keyframes sparkOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2)}}
</style>
</head>
<body>
    <div class="bar">
        <b>🏅 Ruhezustand — Variante A</b>
        <div class="seg">
            <button id="b1" class="on" onclick="setScene(1)">Mit „Neue Art"-Icon</button>
            <button id="b2" onclick="setScene(2)">Nur Rang-Aufstieg</button>
        </div>
        <div class="hint">So sieht der Hinweis aus, <b>bevor</b> man tippt. Tipp das goldene Hexagon an → Variante A startet.</div>
    </div>

    <div class="app">
        <h2>Deine Beobachtungen</h2>
        <p class="lead">(Kulisse — unten rechts siehst du den/die Hinweis-Button/s)</p>
        <div class="cards">
            <div class="ph">🦋</div><div class="ph">🐦</div><div class="ph">🌿</div>
            <div class="ph">🍄</div><div class="ph">🐞</div><div class="ph">🦎</div>
        </div>
    </div>

    <!-- New-species-Icon (nur in Szene 1) -->
    <div class="reward-icon stack-species" id="speciesIcon">
        <div class="ri-cardwrap">
            <div class="ri-card">🃏</div>
            <span class="ri-badge">3</span>
        </div>
        <span class="ri-label">New species</span>
    </div>

    <!-- Rang-Aufstieg-Icon -->
    <div class="rank-icon stack-rank-above" id="rankIcon" onclick="playA()" title="Neuen Rang ansehen">
        <div class="rk-wrap">
            <div class="rk-hex">
                <div class="glow"></div>
                <div class="plate"></div><div class="inner"></div>
                <div class="ico">🐦</div>
            </div>
            <span class="rk-up">▲</span>
        </div>
        <span class="rk-label">Neuer Rang</span>
    </div>

    <!-- Feier-Overlay A -->
    <div class="cel" id="cel" onclick="closeCel()">
        <div class="cel-bg"></div><div class="rays"></div><div class="halo"></div>
        <div class="fx" id="fx"></div>
        <div class="stage" id="stage"></div>
        <div class="taphint">Tippen zum Schließen</div>
    </div>

<script>
    const CONF=['#e9c65a','#9bcc5f','#bfe08f','#f6d365','#fda085','#ffffff','#8bb867'];

    function setScene(n){
        document.getElementById('b1').classList.toggle('on',n===1);
        document.getElementById('b2').classList.toggle('on',n===2);
        const sp=document.getElementById('speciesIcon');
        const rk=document.getElementById('rankIcon');
        if(n===1){
            sp.style.display='flex';
            rk.classList.remove('stack-species'); rk.classList.add('stack-rank-above'); // über dem Neue-Art-Icon
        }else{
            sp.style.display='none';
            rk.classList.remove('stack-rank-above'); rk.classList.add('stack-species');  // rutscht nach unten
        }
    }

    let closed=true;
    function playA(){
        closed=false;
        document.getElementById('cel').classList.add('on');
        const stage=document.getElementById('stage');
        stage.innerHTML=`
            <div class="kicker">Neuer Rang erreicht</div>
            <div class="cat">🐦 Vögel</div>
            <div class="hexbig"><div class="plate"></div><div class="inner"></div><div class="ico">🐦</div><div class="sheen"></div></div>
            <div class="rankname">Vogel</div>
            <div class="fromto"><b>Flügge</b> &nbsp;→&nbsp; <b>Vogel</b> · Stufe 5 / 7</div>
            <div class="pips">
                <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
                <i class="on justnow"></i><i></i><i></i>
            </div>`;
        setTimeout(()=>{ if(!closed){ burst(); confetti(); chime(); } },550);
    }
    function burst(){const fx=document.getElementById('fx');for(let i=0;i<26;i++){const s=document.createElement('span');s.className='spark';
        const a=(Math.PI*2*i)/26,d=120+Math.random()*180;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
        s.style.color=CONF[i%CONF.length];s.style.animationDelay=(Math.random()*.12)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),1100);}}
    function confetti(){const fx=document.getElementById('fx');for(let i=0;i<80;i++){const c=document.createElement('span');c.className='conf';
        c.style.left=Math.random()*100+'vw';c.style.background=CONF[i%CONF.length];c.style.animationDuration=(1.8+Math.random()*1.8)+'s';
        c.style.animationDelay=(Math.random()*.5)+'s';c.style.transform=`rotate(${Math.random()*360}deg)`;if(Math.random()<.4)c.style.borderRadius='50%';
        fx.appendChild(c);setTimeout(()=>c.remove(),3800);}}
    let actx=null;
    function chime(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const n=[523.25,659.25,783.99,1046.5];
        n.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const t=actx.currentTime+i*.12;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
        o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.55);});}catch(e){}}
    function closeCel(){closed=true;document.getElementById('cel').classList.remove('on');document.getElementById('fx').innerHTML='';}

    setScene(1);
</script>
</body>
</html>
